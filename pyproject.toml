[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcription-service"
version = "1.0.0"
description = "BullMQ-driven audio transcription service backed by Deepgram"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "bullmq>=2.11",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "ruff>=0.7",
]

[project.scripts]
transcriber = "transcriber.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# B027: `aclose` hooks are deliberately optional for adapters that hold
# nothing to release.
ignore = ["B027"]

[tool.ruff.lint.per-file-ignores]
# B008 is the prescribed FastAPI dependency-injection idiom.
"src/transcriber/api/routes.py" = ["B008"]
